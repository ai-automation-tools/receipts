<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Receipts</title>
  <style>
    :root { color-scheme: dark; --bg: #060606; --surface: #0b0b0c; --line: #27272a; --fg: #fafafa; --mid: #a1a1aa; --dim: #71717a;
            --found: #4ade80; --conflict: #fbbf24; --missing: #93c5fd; --error: #f87171; }
    body { margin: 0; width: 400px; padding: 14px 16px 16px; background: var(--bg); color: var(--fg);
           font: 13px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    h1 { margin: 0 0 8px; font-size: 15px; }
    p { margin: 0 0 8px; color: var(--mid); }
    :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
    .actions { display: flex; gap: 8px; margin-bottom: 12px; }
    button { padding: 6px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg);
             font: inherit; cursor: pointer; }
    button:hover:not(:disabled) { border-color: var(--mid); }
    button:disabled { opacity: 0.5; cursor: default; }
    #check { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 600; }
    ol { margin: 0; padding: 0; list-style: none; }
    li { margin: 0 0 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
    .status { margin: 0 0 4px; color: var(--dim); }
    .badge { font-weight: 600; }
    .found { color: var(--found); } .conflict { color: var(--conflict); } .not-located { color: var(--missing); } .unreachable { color: var(--error); }
    .claim { color: var(--fg); }
    blockquote { margin: 0 0 6px; padding: 2px 0 2px 10px; border-left: 3px solid var(--line); color: var(--mid); }
    .figures { margin: 0; padding-left: 18px; list-style: disc; }
    .figures li { margin: 0; padding: 0; border: 0; background: none; }
  </style>
</head>
<body>
  <h1>Receipts</h1>
  <p id="message" role="status" aria-live="polite">Looking for an AI Overview…</p>
  <div class="actions">
    <button id="check" type="button" disabled>Check</button>
    <button id="copy" type="button" hidden>Copy report</button>
  </div>
  <ol id="results" aria-label="Claims, flagged first"></ol>
  <script type="module" src="popup.js"></script>
</body>
</html>
